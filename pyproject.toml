[project]
name = "ntro-cli"
version = "0.1.0"
description = "CLI for the ntro platform"
requires-python = ">=3.11"
dependencies = [
    "ntro>=0.1.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
ntro = "ntro_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntro_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
